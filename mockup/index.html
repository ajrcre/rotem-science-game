<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מגיני האנרגיה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div class="bg"></div>

    <!-- Title card -->
    <div class="title-card">
      <div class="stars" id="hud-stars"><span>★</span><span>★</span><span>★</span></div>
      <div class="title-text">
        <small>שלב 1</small>
        <strong>הלייזר הסולארי</strong>
      </div>
    </div>

    <!-- Alien approach meter -->
    <div class="threat">
      <span>החייזר מתקרב!</span>
      <div class="threat-bar"><div class="threat-fill" id="threat-fill"></div></div>
    </div>

    <div class="actor alien" id="alien" role="img" aria-label="חייזר"><div class="rig boil"><img alt=""><img alt=""></div></div>

    <!-- Energy chain -->
    <div class="chain" id="chain"></div>

    <!-- Characters -->
    <div class="actor professor" id="professor" role="img" aria-label="פרופסור וולט"><div class="rig boil"><img alt=""><img alt=""></div></div>
    <div class="bubble" id="bubble"><p id="bubble-text"></p></div>
    <div class="actor sparky" id="sparky" role="img" aria-label="ספארקי"><div class="rig boil"><img alt=""><img alt=""></div></div>

    <!-- Lever (appears when the chain is complete) -->
    <div class="lever" id="lever">
      <div class="lever-hint" id="lever-hint">גררו למטה!</div>
      <div class="lever-handle" id="lever-handle" role="button" aria-label="ידית – גררו למטה"><svg viewBox="0 0 120 300">
        <defs>
          <linearGradient id="rod" x1="0" x2="1">
            <stop offset="0" stop-color="#8a5a24"/><stop offset=".35" stop-color="#f1c66e"/>
            <stop offset=".7" stop-color="#c08a3e"/><stop offset="1" stop-color="#6e4519"/>
          </linearGradient>
          <radialGradient id="knob" cx=".35" cy=".3" r=".75">
            <stop offset="0" stop-color="#ffb3a0"/><stop offset=".35" stop-color="#e2412f"/>
            <stop offset="1" stop-color="#7d1810"/>
          </radialGradient>
        </defs>
        <rect x="48" y="58" width="24" height="236" rx="10" fill="url(#rod)" stroke="#1c1410" stroke-width="6"/>
        <circle cx="60" cy="52" r="46" fill="url(#knob)" stroke="#1c1410" stroke-width="7"/>
        <ellipse cx="44" cy="34" rx="13" ry="8" fill="#fff" opacity=".8" transform="rotate(-30 44 34)"/>
      </svg></div>
      <img class="lever-base" src="../assets/art/lever_base.png" alt="">
    </div>

    <!-- Card tray -->
    <div class="tray">
      <div class="tray-label">הקלפים שלך</div>
      <div class="cards" id="cards"></div>
    </div>

    <!-- Laser beam / FX layer -->
    <div class="beam" id="beam"></div>
    <div class="flash" id="flash"></div>

    <!-- Porthole cutscene -->
    <div class="window-scene" id="window-scene">
      <div class="porthole-view">
        <img class="sky" src="../assets/art/night_sky.jpg" alt="">
        <img class="ufo" id="ufo" src="../assets/art/alien.png" alt="">
        <div id="debris"></div>
        <img class="boom" id="boom" src="../assets/art/explosion.png" alt="">
        <img class="cannon" id="cannon" src="../assets/art/laser.png" alt="">
        <canvas class="fx" id="fx" width="960" height="960"></canvas>
      </div>
      <img class="porthole-frame" src="../assets/art/porthole.png" alt="">
      <div class="boom-word" id="boom-word">בּוּם!</div>
    </div>

    <!-- Victory screen -->
    <div class="victory" id="victory">
      <div class="victory-card">
        <div class="ribbon">כדור הארץ ניצל!</div>
        <div class="big-stars" id="big-stars"></div>
        <h3>מה למדת:</h3>
        <div class="summary" id="summary"></div>
        <p class="lesson">אנרגיה לא נוצרת ולא נעלמת – היא רק הופכת מסוג לסוג.</p>
        <div class="buttons">
          <button class="btn" id="btn-quiz">לבוחן הקצר</button>
          <button class="btn alt" id="btn-replay">שחק שוב</button>
        </div>
      </div>
    </div>

    <!-- Old film overlay -->
    <canvas class="grain" id="grain"></canvas>
    <div class="scratches"><i></i><i></i><i></i></div>
    <div class="vignette"></div>
    <div class="iris" id="iris"></div>
  </div>
</div>

<!-- Hand-drawn "line boil" filter -->
<svg width="0" height="0" style="position:absolute">
  <filter id="boil">
    <feTurbulence id="boil-noise" type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="1"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/>
  </filter>
</svg>

<script src="game.js"></script>
</body>
</html>
